services:
  # ─────────────────────────── Backend API ──────────────────────────
  - type: web
    name: sentinel-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sentinel-redis
          property: connectionString
      - key: NEO4J_URI
        value: bolt://sentinel-neo4j:7687
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        value: sentinel_graph
      - key: QDRANT_URL
        value: http://sentinel-qdrant:6333
      - key: NVIDIA_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false

  # ─────────────────────────── Celery Worker ────────────────────────
  - type: worker
    name: sentinel-celery-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4 -Q default,pipeline,indexing
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sentinel-redis
          property: connectionString
      - key: NEO4J_URI
        value: bolt://sentinel-neo4j:7687
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        value: sentinel_graph
      - key: QDRANT_URL
        value: http://sentinel-qdrant:6333
      - key: NVIDIA_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false

  # ─────────────────────────── Celery Beat ──────────────────────────
  - type: worker
    name: sentinel-celery-beat
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A app.tasks.celery_app beat --loglevel=info
    plan: starter
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: sentinel-redis
          property: connectionString

  # ─────────────────────────── Neo4j ────────────────────────────────
  - type: pserv
    name: sentinel-neo4j
    env: docker
    image: neo4j:5-community
    plan: starter
    disk:
      name: neo4j-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: NEO4J_AUTH
        value: neo4j/sentinel_graph
      - key: NEO4J_PLUGINS
        value: '["apoc"]'
      - key: NEO4J_dbms_memory_heap_max__size
        value: 512M
      - key: NEO4J_dbms_memory_pagecache_size
        value: 256M

  # ─────────────────────────── Qdrant ───────────────────────────────
  - type: pserv
    name: sentinel-qdrant
    env: docker
    image: qdrant/qdrant:latest
    plan: starter
    disk:
      name: qdrant-data
      mountPath: /qdrant/storage
      sizeGB: 10
    envVars:
      - key: QDRANT_INIT_SNAP_INTERVAL
        value: "0"

databases:
  # ─────────────────────────── PostgreSQL ───────────────────────────
  - name: sentinel-postgres
    databaseName: sentinel
    user: sentinel
    plan: starter

redis:
  # ─────────────────────────── Redis ────────────────────────────────
  - name: sentinel-redis
    plan: starter
